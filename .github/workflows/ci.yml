name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy — Agent
        run: cargo clippy --manifest-path panel/agent/Cargo.toml --release 2>&1 || true

      - name: Clippy — Backend
        run: cargo clippy --manifest-path panel/backend/Cargo.toml --release 2>&1 || true

      - name: Clippy — CLI
        run: cargo clippy --manifest-path panel/cli/Cargo.toml --release 2>&1 || true

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install dependencies
        run: cd panel/frontend && npm ci

      - name: Type check
        run: cd panel/frontend && npx tsc --noEmit

  build-rust:
    name: Build (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build Agent
        run: cargo build --release --manifest-path panel/agent/Cargo.toml

      - name: Build Backend
        run: cargo build --release --manifest-path panel/backend/Cargo.toml

      - name: Build CLI
        run: cargo build --release --manifest-path panel/cli/Cargo.toml

      - name: Report binary sizes
        run: |
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | $(du -h panel/agent/target/release/dockpanel-agent | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| API | $(du -h panel/backend/target/release/dockpanel-api | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI | $(du -h panel/cli/target/release/dockpanel | cut -f1) |" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install and build
        run: |
          cd panel/frontend
          npm ci
          npx vite build

      - name: Report bundle size
        run: |
          echo "### Frontend Bundle" >> $GITHUB_STEP_SUMMARY
          du -sh panel/frontend/dist/ >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            panel/agent/target/
            panel/backend/target/
            panel/cli/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Test Agent
        run: cargo test --manifest-path panel/agent/Cargo.toml

      - name: Test Backend
        run: cargo test --manifest-path panel/backend/Cargo.toml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Audits are ENFORCING (no `|| true`): a real advisory now FAILS the build.
      # Accepted, upstream-blocked items are ignored narrowly and on purpose —
      # panel/backend/.cargo/audit.toml pins RUSTSEC-2023-0071 (the rsa phantom
      # lockfile entry from sqlx-mysql; DockPanel is Postgres-only). Unmaintained
      # and yanked advisories are cargo-audit *warnings* and do not fail the run.
      - name: Audit Agent
        run: cd panel/agent && cargo audit

      - name: Audit Backend
        run: cd panel/backend && cargo audit

      - name: Audit CLI
        run: cd panel/cli && cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # npm has no ignore mechanism, so one advisory that cannot affect us kept
      # this whole job red on every commit for six releases — and a job that is
      # always failing cannot report a NEW failure. The gate below still fails
      # the build on anything at high/critical; it waives only advisories listed
      # in scripts/npm-audit-gate.mjs with a written reason, prints that reason,
      # and flags a waiver that no longer matches anything.
      # Its own behaviour (both directions) is pinned in
      # tests/ssl-correctness-pin-e2e.sh.
      - name: Audit Frontend
        run: cd panel/frontend && npm ci && node ../../scripts/npm-audit-gate.mjs

      - name: Audit Marketing Site (client)
        run: cd website/client && npm ci && node ../../scripts/npm-audit-gate.mjs

      - name: Audit Marketing Site (server)
        run: cd website/server && npm ci && node ../../scripts/npm-audit-gate.mjs

  # s263: the same fact was published on three surfaces — the .md files GitHub
  # renders, docs.dockpanel.dev, and the dockpanel.dev marketing site — and kept
  # in sync by hand. It drifted: the app-template count read 152 in ten places
  # while the catalogue held 153, and FEATURES.md was stamped with a version
  # five months and 28 releases old. Neither was discoverable without counting a
  # Rust array by hand, so neither was ever discovered.
  #
  # This job makes the published numbers derive from source and checks them on
  # every commit, which is the only version of "keep the docs in sync" that does
  # not depend on somebody remembering.
  docs-claims:
    name: Documentation Claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Published claims match the source
        run: bash tests/docs-claims-pin-e2e.sh
